  도형은 `body.tsx`에서 그대로 옮겼다 — `tray-icon.test.ts`가 둘의 `d`가
  어긋나지 않게 지킨다.

  **템플릿 아이콘이라 macOS는 알파만 본다.** 색은 버려지므로 흰 배와 눈은
